<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explox</title>
  <!-- Root-domain redirect — cubbyexplosion.github.io only serves a real page when a repo named
       EXACTLY "CubbyExplosion.github.io" exists (GitHub's special "user site" rule); the actual
       game lives one path down, in the explox-the-best repo. This page exists so the bare root
       domain returns a real 200 instead of a 404 — needed for AdSense's site verification, which
       couldn't find/verify anything at the root before this repo existed. -->
  <meta http-equiv="refresh" content="0; url=https://cubbyexplosion.github.io/explox-the-best/play/index.html">
  <script>window.location.replace('https://cubbyexplosion.github.io/explox-the-best/play/index.html');</script>
  <style>
    body { margin:0; background:#050f18; color:#eee; font-family:Arial,sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; text-align:center; }
    a { color:#44ccff; }
  </style>
</head>
<body>
  <p>Redirecting to <a href="https://cubbyexplosion.github.io/explox-the-best/play/index.html">Explox</a>...</p>
